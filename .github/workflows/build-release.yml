name: Build Release (IPA / TIPA)

# Builds one Blinker Fluid variant (standard or JIT) following the recipe in
# README.md ("Building v<version>"), then packages the result as both a
# .ipa and an AirDrop-friendly .tipa (a .tipa is just a renamed .ipa —
# TrollStore accepts either).
#
# WHY THIS IS SPLIT INTO "LEGS":
#   GitHub-hosted runners hard-cap every job at 6 hours of execution time —
#   this is enforced by GitHub itself and can't be raised with
#   `timeout-minutes`. A from-scratch Chromium iOS build can take
#   considerably longer than that. So instead of one job, this workflow
#   runs up to 5 sequential "leg" jobs (leg1..leg5). Each leg:
#     1. Restores the exact checkout + partial build output from the
#        previous leg (skipped on leg 1, which does the initial
#        `gclient sync` + `gn gen` instead).
#     2. Runs `ninja` under an internal time budget (`leg_budget_minutes`,
#        default 4h — comfortably under the 6h hard cap once you account
#        for setup/restore/save overhead each leg).
#     3. If ninja finishes inside the budget: packages the IPA/TIPA and
#        marks the run complete, so every later leg job is skipped.
#     4. If it runs out of budget first: tars up the *entire* checkout —
#        including all partial .o files — and hands that to the next leg.
#        Ninja is naturally incremental, so the next leg picks up exactly
#        where this one left off; nothing is rebuilt from scratch.
#   5 legs x 4h budget = 20h of ninja time available in total, which should
#   be very generous headroom even on a slow runner. If it's still not
#   enough, duplicate one of the `legN` job blocks below with the next
#   number and wire it into the `needs`/`if` chain the same way the
#   existing legs are.
#
# A NOTE ON DISK, EVEN WITH LEGS:
#   The state handed between legs is the *entire* Chromium checkout plus
#   whatever's been built so far — this can be tens of GB, compressed with
#   zstd. Uploading/downloading that between legs adds real time on top of
#   each leg's ninja budget, and eats into GitHub's artifact storage quota
#   for your repo/org. If that becomes the bottleneck, a self-hosted
#   runner (no 6h cap, no need to round-trip state through artifacts at
#   all) is the more efficient answer — the `runner: self-hosted` input
#   still works, and leg 2+ will simply see nothing to restore. For
#   self-hosted you'd generally want the whole build to fit in one leg's
#   budget; set `leg_budget_minutes` high (e.g. 1440) in that case.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to build on"
        type: choice
        options:
          - self-hosted
          - macos-26
          - macos-26-xlarge
        default: self-hosted
      variant:
        description: "Which variant to build"
        type: choice
        options:
          - standard
          - jit
        default: standard
      chromium_ref:
        description: "Chromium src commit to sync (defaults to BASE_COMMIT.txt)"
        type: string
        required: false
      version:
        description: "App version, e.g. 0.6.0 (defaults to the pushed tag)"
        type: string
        required: false
      leg_budget_minutes:
        description: "Minutes of ninja time per leg (keep well under 360 to leave room for setup/restore/save on hosted runners)"
        type: string
        default: "240"
  push:
    tags:
      - "v*"

env:
  CHROMIUM_DIR: ${{ github.workspace }}/chromium
  DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools

jobs:
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      chromium_ref: ${{ steps.resolve.outputs.chromium_ref }}
      version: ${{ steps.resolve.outputs.version }}
      runner: ${{ steps.resolve.outputs.runner }}
      variant: ${{ steps.resolve.outputs.variant }}
      out_dir: ${{ steps.resolve.outputs.out_dir }}
      bundle_suffix: ${{ steps.resolve.outputs.bundle_suffix }}
      leg_budget_minutes: ${{ steps.resolve.outputs.leg_budget_minutes }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail

          ref="${{ inputs.chromium_ref }}"
          if [ -z "$ref" ]; then
            ref="$(sed -n 's/^Chromium base commit: //p' BASE_COMMIT.txt | head -n1)"
          fi
          echo "chromium_ref=$ref" >> "$GITHUB_OUTPUT"

          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          runner="${{ inputs.runner }}"
          if [ -z "$runner" ]; then
            runner="self-hosted"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

          variant="${{ inputs.variant }}"
          if [ -z "$variant" ]; then
            variant="standard"
          fi
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          if [ "$variant" = "jit" ]; then
            echo "out_dir=out/blink14-jit" >> "$GITHUB_OUTPUT"
            echo "bundle_suffix=.jit" >> "$GITHUB_OUTPUT"
          else
            echo "out_dir=out/blink14" >> "$GITHUB_OUTPUT"
            echo "bundle_suffix=" >> "$GITHUB_OUTPUT"
          fi

          budget="${{ inputs.leg_budget_minutes }}"
          if [ -z "$budget" ]; then
            budget="240"
          fi
          echo "leg_budget_minutes=$budget" >> "$GITHUB_OUTPUT"

          echo "Resolved chromium_ref=$ref version=$version runner=$runner variant=$variant budget=${budget}m"

  leg1:
    needs: resolve-config
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 345
    outputs:
      complete: ${{ steps.attempt.outputs.complete }}
    steps:
      - name: Checkout Blinker Fluid overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Build attempt (leg 1 — first-time setup)
        id: attempt
        uses: ./overlay/.github/actions/blinker-build-attempt
        with:
          budget_minutes: ${{ needs.resolve-config.outputs.leg_budget_minutes }}
          out_dir: ${{ needs.resolve-config.outputs.out_dir }}
          bundle_suffix: ${{ needs.resolve-config.outputs.bundle_suffix }}
          chromium_ref: ${{ needs.resolve-config.outputs.chromium_ref }}
          app_version: ${{ needs.resolve-config.outputs.version }}
          overlay_dir: ${{ github.workspace }}/overlay
          chromium_dir: ${{ env.CHROMIUM_DIR }}
          depot_tools_dir: ${{ env.DEPOT_TOOLS_DIR }}

      - name: Upload progress for next leg
        if: steps.attempt.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-state-leg1
          path: ${{ steps.attempt.outputs.next_state_archive }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload finished IPA/TIPA
        if: steps.attempt.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-release
          path: ${{ steps.attempt.outputs.dist_dir }}
          retention-days: 14
          if-no-files-found: error

  leg2:
    needs: [resolve-config, leg1]
    if: needs.leg1.outputs.complete != 'true'
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 345
    outputs:
      complete: ${{ steps.attempt.outputs.complete }}
    steps:
      - name: Checkout Blinker Fluid overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Download previous leg's progress
        uses: actions/download-artifact@v4
        with:
          name: blinkerfluid-state-leg1
          path: restore

      - name: Build attempt (leg 2 — resuming)
        id: attempt
        uses: ./overlay/.github/actions/blinker-build-attempt
        with:
          budget_minutes: ${{ needs.resolve-config.outputs.leg_budget_minutes }}
          out_dir: ${{ needs.resolve-config.outputs.out_dir }}
          bundle_suffix: ${{ needs.resolve-config.outputs.bundle_suffix }}
          chromium_ref: ${{ needs.resolve-config.outputs.chromium_ref }}
          app_version: ${{ needs.resolve-config.outputs.version }}
          overlay_dir: ${{ github.workspace }}/overlay
          chromium_dir: ${{ env.CHROMIUM_DIR }}
          depot_tools_dir: ${{ env.DEPOT_TOOLS_DIR }}
          restore_archive: restore/next-state.tar.zst

      - name: Upload progress for next leg
        if: steps.attempt.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-state-leg2
          path: ${{ steps.attempt.outputs.next_state_archive }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload finished IPA/TIPA
        if: steps.attempt.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-release
          path: ${{ steps.attempt.outputs.dist_dir }}
          retention-days: 14
          if-no-files-found: error

  leg3:
    needs: [resolve-config, leg2]
    if: needs.leg2.outputs.complete != 'true'
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 345
    outputs:
      complete: ${{ steps.attempt.outputs.complete }}
    steps:
      - name: Checkout Blinker Fluid overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Download previous leg's progress
        uses: actions/download-artifact@v4
        with:
          name: blinkerfluid-state-leg2
          path: restore

      - name: Build attempt (leg 3 — resuming)
        id: attempt
        uses: ./overlay/.github/actions/blinker-build-attempt
        with:
          budget_minutes: ${{ needs.resolve-config.outputs.leg_budget_minutes }}
          out_dir: ${{ needs.resolve-config.outputs.out_dir }}
          bundle_suffix: ${{ needs.resolve-config.outputs.bundle_suffix }}
          chromium_ref: ${{ needs.resolve-config.outputs.chromium_ref }}
          app_version: ${{ needs.resolve-config.outputs.version }}
          overlay_dir: ${{ github.workspace }}/overlay
          chromium_dir: ${{ env.CHROMIUM_DIR }}
          depot_tools_dir: ${{ env.DEPOT_TOOLS_DIR }}
          restore_archive: restore/next-state.tar.zst

      - name: Upload progress for next leg
        if: steps.attempt.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-state-leg3
          path: ${{ steps.attempt.outputs.next_state_archive }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload finished IPA/TIPA
        if: steps.attempt.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-release
          path: ${{ steps.attempt.outputs.dist_dir }}
          retention-days: 14
          if-no-files-found: error

  leg4:
    needs: [resolve-config, leg3]
    if: needs.leg3.outputs.complete != 'true'
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 345
    outputs:
      complete: ${{ steps.attempt.outputs.complete }}
    steps:
      - name: Checkout Blinker Fluid overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Download previous leg's progress
        uses: actions/download-artifact@v4
        with:
          name: blinkerfluid-state-leg3
          path: restore

      - name: Build attempt (leg 4 — resuming)
        id: attempt
        uses: ./overlay/.github/actions/blinker-build-attempt
        with:
          budget_minutes: ${{ needs.resolve-config.outputs.leg_budget_minutes }}
          out_dir: ${{ needs.resolve-config.outputs.out_dir }}
          bundle_suffix: ${{ needs.resolve-config.outputs.bundle_suffix }}
          chromium_ref: ${{ needs.resolve-config.outputs.chromium_ref }}
          app_version: ${{ needs.resolve-config.outputs.version }}
          overlay_dir: ${{ github.workspace }}/overlay
          chromium_dir: ${{ env.CHROMIUM_DIR }}
          depot_tools_dir: ${{ env.DEPOT_TOOLS_DIR }}
          restore_archive: restore/next-state.tar.zst

      - name: Upload progress for next leg
        if: steps.attempt.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-state-leg4
          path: ${{ steps.attempt.outputs.next_state_archive }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload finished IPA/TIPA
        if: steps.attempt.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-release
          path: ${{ steps.attempt.outputs.dist_dir }}
          retention-days: 14
          if-no-files-found: error

  leg5:
    needs: [resolve-config, leg4]
    if: needs.leg4.outputs.complete != 'true'
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 345
    outputs:
      complete: ${{ steps.attempt.outputs.complete }}
    steps:
      - name: Checkout Blinker Fluid overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Download previous leg's progress
        uses: actions/download-artifact@v4
        with:
          name: blinkerfluid-state-leg4
          path: restore

      - name: Build attempt (leg 5 — resuming, final leg)
        id: attempt
        uses: ./overlay/.github/actions/blinker-build-attempt
        with:
          budget_minutes: ${{ needs.resolve-config.outputs.leg_budget_minutes }}
          out_dir: ${{ needs.resolve-config.outputs.out_dir }}
          bundle_suffix: ${{ needs.resolve-config.outputs.bundle_suffix }}
          chromium_ref: ${{ needs.resolve-config.outputs.chromium_ref }}
          app_version: ${{ needs.resolve-config.outputs.version }}
          overlay_dir: ${{ github.workspace }}/overlay
          chromium_dir: ${{ env.CHROMIUM_DIR }}
          depot_tools_dir: ${{ env.DEPOT_TOOLS_DIR }}
          restore_archive: restore/next-state.tar.zst

      - name: Upload finished IPA/TIPA
        if: steps.attempt.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blinkerfluid-release
          path: ${{ steps.attempt.outputs.dist_dir }}
          retention-days: 14
          if-no-files-found: error

      - name: Report if still incomplete after 5 legs
        if: steps.attempt.outputs.complete != 'true'
        run: |
          echo "::error::Build did not finish within 5 legs (5 x ${{ needs.resolve-config.outputs.leg_budget_minutes }}m). Either raise leg_budget_minutes, add a leg6 job following the same pattern as leg2-5, or switch to a self-hosted runner." >&2
          exit 1

  release:
    needs: [resolve-config, leg1, leg2, leg3, leg4, leg5]
    if: always() && github.ref_type == 'tag' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download the finished IPA/TIPA
        uses: actions/download-artifact@v4
        with:
          name: blinkerfluid-release
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Blinker Fluid ${{ needs.resolve-config.outputs.version }} (${{ needs.resolve-config.outputs.variant }})
          tag_name: ${{ github.ref_name }}
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
