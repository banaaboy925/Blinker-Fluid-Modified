name: Build Release (IPA / TIPA, checkpointed)
#
# Builds Blinker Fluid for iOS in JITless and JIT configurations, each as a
# chain of jobs on standard GitHub-hosted macOS runners: one `*-sync` job
# does the (fast, ~40min observed) checkout + `gn gen`, then several
# `*-build-legN` jobs each run ninja under a bounded timeout and hand the
# whole workspace off to the next leg via an artifact, until the .ipa
# exists. `needs:` chains trigger each next job automatically the moment
# its predecessor finishes -- no manual re-run, no self-dispatch, no PAT.
#
# WHY THIS SHAPE: GitHub-hosted runners hard-cap every job at 6h with no
# override, and a from-scratch Chromium/content_shell build with no access
# to Google's (access-gated) RBE remote-execution service -- compiling
# locally on a runner's own handful of cores -- is plausibly a
# multi-*-hour build, likely longer than one job's budget. Ninja is safely
# interruptible (it tracks finished objects in its own log and just
# rebuilds whatever was mid-flight), so stopping cleanly before the wall
# and resuming in a later job is a legitimate, standard technique.
#
# THE REAL COST: each leg is a brand-new, disk-wiped VM -- there is no
# persistent disk to resume "in place" on. Every leg must download the
# *entire* workspace (full source checkout + however much of out/ has been
# built so far) from the previous leg's artifact, and re-upload it at the
# end. That transfer is pure overhead on top of the self-hosted-runner
# case, and it grows every leg as out/ accumulates more built objects.
# We tar+zstd the whole workspace into one file before upload/download,
# because letting actions/upload-artifact zip several hundred thousand
# individual source-tree files itself is far slower than one big archive.
#
# LEG COUNT: 3 build legs per track below (~5h build budget each => ~15h
# of ninja time per track, run in parallel across the jit/jitless tracks).
# If a track still hasn't produced an .ipa after leg 3, the package job
# fails with a clear message telling you to add a leg 4 -- copy the
# leg-3 job block, rename it, point its `needs:` at leg-3, and repoint
# the package job's `needs:`/download step at the new final leg.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      chromium_commit:
        description: "Override Chromium base commit (defaults to BASE_COMMIT.txt)"
        required: false
        default: ""
      jitless_resume_run_id:
        description: "Resume jitless track from a PAST run's artifact instead of running jitless-sync (leave blank for a normal full run). Find the run ID in that run's URL: .../actions/runs/<this number>."
        required: false
        default: ""
      jitless_resume_artifact:
        description: "Artifact name to resume the jitless track from, in the run above (e.g. jitless-state-leg6)."
        required: false
        default: "jitless-state-leg6"
      jit_resume_run_id:
        description: "Resume jit track from a PAST run's artifact instead of running jit-sync (leave blank for a normal full run). Find the run ID in that run's URL: .../actions/runs/<this number>."
        required: false
        default: ""
      jit_resume_artifact:
        description: "Artifact name to resume the jit track from, in the run above (e.g. jit-state-leg6)."
        required: false
        default: "jit-state-leg6"

# Cross-run artifact download (used by the resume-from-a-past-run inputs
# above) needs actions:read on the token; everything else this workflow
# does only needs the default read access.
permissions:
  contents: read
  actions: read

env:
  DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools
  CHROMIUM_SRC: ${{ github.workspace }}/chromium/src
  BUNDLE_ID: com.nodesclock.blinkerfluid
  # Minutes given to the ninja invocation itself within each build-leg job
  # (the rest of that job's 360-minute hosted-runner budget covers disk
  # cleanup + downloading/extracting the incoming state + re-archiving and
  # uploading the outgoing state). Shrink this in later legs if transfer
  # overhead is eating into the margin as out/ grows -- watch the "Free up
  # disk space" / restore-state step durations in the logs.
  BUILD_STEP_TIMEOUT_MINUTES: 270

# Unspecified shell on GitHub-hosted runners is "bash -e {0}" -- NOT
# "-eo pipefail" (that flag is only added when you write `shell: bash`
# explicitly). Without it, a failing left-hand command in any `a | b | c`
# pipe is invisible: the step's exit code is whatever the *last* command
# returned. That is what silently produced a truncated state archive
# below (tar died partway through `tar | zstd | split`, but `split`
# still exited 0). Forcing pipefail everywhere makes that class of bug
# fail loudly instead of shipping a corrupt artifact to the next leg.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # =========================================================================
  # JITLESS track
  # =========================================================================

  jitless-sync:
    name: JITless / 1. Sync + gn gen
    if: ${{ github.event.inputs.jitless_resume_run_id == '' }}
    runs-on: macos-26
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout fork overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Free up disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/.rbenv ~/.nvm ~/.gem /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-sdk || true
          sudo rm -rf ~/Library/Caches/Homebrew || true
          # These platform SDKs aren't needed for a device-arm64 ios_app_ipa
          # build and are multiple GB each on current runner images.
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/{WatchOS,AppleTVOS,XROS,DriverKit}*.platform || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          brew cleanup -s >/dev/null 2>&1 || true
          echo "After cleanup:"; df -h /

      - name: Mount case-sensitive volume for Chromium checkout
        run: |
          # Chromium's source tree requires a case-sensitive filesystem to
          # check out cleanly -- it has paths that collide under
          # case-insensitive comparison. GitHub's macOS runners default to
          # a case-insensitive APFS root volume, which surfaces as
          # "cannot create directory/file ... Invalid argument" partway
          # through gclient sync (or as a silent path collision if it
          # happens during a tar extraction here in a later leg instead of
          # a live git checkout in *-sync). Work around it by doing all
          # chromium/depot_tools I/O on a freshly-created case-sensitive
          # APFS volume, via symlinks so every other step's relative
          # "chromium"/"depot_tools" paths keep working unmodified.
          # Don't pre-create /Volumes/ChromiumCS by hand: /Volumes is
          # root-owned, so a plain `mkdir` there as the runner user fails
          # with "Permission denied". hdiutil attach creates the mount
          # point itself (via the disk-arbitration subsystem, which has
          # the privilege a userland mkdir doesn't) when given -mountpoint
          # on a path that doesn't exist yet.
          hdiutil create -size 200g -fs "Case-sensitive APFS" -volname ChromiumCS -type SPARSE -nospotlight ~/ChromiumCS
          hdiutil attach ~/ChromiumCS.sparseimage -nobrowse -mountpoint /Volumes/ChromiumCS
          mkdir -p /Volumes/ChromiumCS/chromium /Volumes/ChromiumCS/depot_tools
          ln -s /Volumes/ChromiumCS/chromium "${{ github.workspace }}/chromium"
          ln -s /Volumes/ChromiumCS/depot_tools "${{ github.workspace }}/depot_tools"

      - name: Read base commit metadata
        id: meta
        run: |
          COMMIT=$(grep 'Chromium base commit' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          if [ -n "${{ github.event.inputs.chromium_commit }}" ]; then
            COMMIT="${{ github.event.inputs.chromium_commit }}"
          fi
          VERSION=$(grep '^Version:' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300

      - name: gclient sync
        working-directory: ${{ github.workspace }}
        run: |
          # `fetch ios` doesn't just write .gclient config -- it runs its
          # own internal `gclient sync` that checks out src at whatever
          # the *live tip* of Chromium's main branch is at that exact
          # moment, before we then fetch+checkout our older pinned commit
          # on top of it. Upstream Chromium lands many commits an hour, so
          # that transition is against a different, arbitrary starting
          # tree every run -- if a rename or file<->directory type change
          # landed upstream in the wrong spot relative to our pinned
          # commit, the checkout can fail with "cannot create
          # directory/file ... Invalid argument". This is a timing flake,
          # not a deterministic property of the pinned commit, so retry
          # from a clean slate rather than failing the whole sync outright.
          for attempt in 1 2 3; do
            rm -rf chromium
            mkdir -p chromium
            (
              cd chromium
              fetch --nohooks --no-history ios
              cd src
              git fetch --depth=1 origin "${{ steps.meta.outputs.commit }}"
              git checkout --force "${{ steps.meta.outputs.commit }}"
            ) && break
            echo "::warning::gclient sync checkout attempt $attempt failed (likely a timing-dependent collision against Chromium's moving tip -- see comment above); retrying from scratch..."
            if [ "$attempt" = 3 ]; then
              echo "::error::gclient sync checkout failed after 3 clean-slate attempts."
              exit 1
            fi
            sleep 30
          done
          cd chromium
          gclient sync -D --no-history -j 4

      - name: Sync V8 to pinned commit
        working-directory: ${{ env.CHROMIUM_SRC }}/v8
        run: |
          V8_COMMIT=$(grep 'V8 base commit' "${{ github.workspace }}/overlay/BASE_COMMIT.txt" | awk '{print $NF}')
          git fetch origin "$V8_COMMIT"
          git checkout "$V8_COMMIT"

      - name: Overlay Blinker Fluid source changes
        run: |
          rsync -a --exclude 'v8/' "${{ github.workspace }}/overlay/src/" "$CHROMIUM_SRC/"
          rsync -a "${{ github.workspace }}/overlay/src/v8/" "$CHROMIUM_SRC/v8/"

      - name: Run hooks
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: gclient runhooks

      - name: Verify gn toolchain fetched
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          test -x buildtools/mac/gn || { echo "::error::buildtools/mac/gn is missing after gclient runhooks -- the host gn binary was never fetched."; exit 1; }
          ./buildtools/mac/gn --version

      - name: Generate GN args (jitless)
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          mkdir -p out/jitless
          cat "${{ github.workspace }}/overlay/build_args.gn" > out/jitless/args.gn
          {
            echo "v8_jitless = true"
            echo "ios_code_signing_identity = \"\""
            # Force classic Ninja instead of Chromium's default Siso
            # backend. Siso keeps its own local filesystem-state cache
            # (separate from Ninja's portable .ninja_log) that appears
            # tied to the specific machine it was built on -- restoring
            # the tree onto a fresh VM each leg made it re-derive
            # everything as unbuilt rather than trust the cache, even
            # though the actual object files survived. Classic Ninja's
            # mtime + .ninja_log model is exactly what checkpoint/resume
            # across arbitrary machines needs. If this GN arg is rejected
            # (Chromium has floated eventually dropping Ninja support),
            # remove this line and the resumability problem needs a
            # different fix -- see the "Verify restored build state" step
            # in each build leg for evidence either way.
            echo "use_siso = false"
            # See jit/BUILD.gn assert: sparkplug/maglev/turbofan default to
            # true and are incompatible with v8_jitless. v8_enable_drumbrake
            # (the Wasm interpreter) is already on via build_args.gn, which
            # is the documented exception that keeps Wasm working jitless.
            echo "v8_enable_sparkplug = false"
            echo "v8_enable_maglev = false"
            echo "v8_enable_turbofan = false"
          } >> out/jitless/args.gn
          gn gen out/jitless

      - name: Archive workspace state
        working-directory: ${{ github.workspace }}
        run: |
          brew install zstd >/dev/null 2>&1 || true
          rm -f state.tar.zst.part-*
          echo "Disk space before archiving:"; df -h "${{ github.workspace }}"
          tar --exclude='.git' -cf - chromium depot_tools | zstd -T0 -3 | split -b 1900m - state.tar.zst.part-
          ls -lh state.tar.zst.part-*
          echo "Verifying archive integrity before upload..."
          cat state.tar.zst.part-* | zstd -t
          echo "Archive OK: $(cat state.tar.zst.part-* | wc -c) bytes across $(ls state.tar.zst.part-* | wc -l) parts"

      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: jitless-state-sync
          path: state.tar.zst.part-*
          retention-days: 1
          if-no-files-found: error

  jitless-build-leg1:
    name: JITless / 2. Build leg 1
    needs: jitless-sync
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-26
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/.rbenv ~/.nvm ~/.gem /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-sdk || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/{WatchOS,AppleTVOS,XROS,DriverKit}*.platform || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          brew cleanup -s >/dev/null 2>&1 || true
          df -h /
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Mount case-sensitive volume for Chromium checkout
        run: |
          # Chromium's source tree requires a case-sensitive filesystem to
          # check out cleanly -- it has paths that collide under
          # case-insensitive comparison. GitHub's macOS runners default to
          # a case-insensitive APFS root volume, which surfaces as
          # "cannot create directory/file ... Invalid argument" partway
          # through gclient sync (or as a silent path collision if it
          # happens during a tar extraction here in a later leg instead of
          # a live git checkout in *-sync). Work around it by doing all
          # chromium/depot_tools I/O on a freshly-created case-sensitive
          # APFS volume, via symlinks so every other step's relative
          # "chromium"/"depot_tools" paths keep working unmodified.
          # Don't pre-create /Volumes/ChromiumCS by hand: /Volumes is
          # root-owned, so a plain `mkdir` there as the runner user fails
          # with "Permission denied". hdiutil attach creates the mount
          # point itself (via the disk-arbitration subsystem, which has
          # the privilege a userland mkdir doesn't) when given -mountpoint
          # on a path that doesn't exist yet.
          hdiutil create -size 200g -fs "Case-sensitive APFS" -volname ChromiumCS -type SPARSE -nospotlight ~/ChromiumCS
          hdiutil attach ~/ChromiumCS.sparseimage -nobrowse -mountpoint /Volumes/ChromiumCS
          mkdir -p /Volumes/ChromiumCS/chromium /Volumes/ChromiumCS/depot_tools
          ln -s /Volumes/ChromiumCS/chromium "${{ github.workspace }}/chromium"
          ln -s /Volumes/ChromiumCS/depot_tools "${{ github.workspace }}/depot_tools"

      - name: Download incoming state
        uses: actions/download-artifact@v4
        with:
          # Normally: this run's own jitless-state-sync (from jitless-sync
          # above). If jitless_resume_run_id was set at dispatch time:
          # jitless_resume_artifact from that past run instead, letting
          # this leg pick up where an earlier, now-fixed run left off
          # without redoing gclient sync or any already-compiled legs.
          name: ${{ github.event.inputs.jitless_resume_run_id != '' && github.event.inputs.jitless_resume_artifact || 'jitless-state-sync' }}
          run-id: ${{ github.event.inputs.jitless_resume_run_id != '' && github.event.inputs.jitless_resume_run_id || github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Extract state
        working-directory: ${{ github.workspace }}
        run: |
          brew install zstd >/dev/null 2>&1 || true
          echo "Disk space before extract:"; df -h "${{ github.workspace }}"
          for part in state.tar.zst.part-*; do cat "$part"; rm -f "$part"; done | zstd -d -T0 -c | tar -xf -
          echo "Disk space after extract:"; df -h "${{ github.workspace }}"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "Verifying restored toolchain..."
          test -x chromium/src/buildtools/mac/gn || { echo "::error::buildtools/mac/gn missing or not executable after restoring state -- the upstream state artifact is incomplete/corrupt (most likely a truncated archive carried over from an earlier leg). Re-run the job that produced the artifact this leg downloaded (or jitless-sync/jit-sync) to regenerate a clean one before retrying this leg."; exit 1; }

      - name: Checkout overlay (source fixes)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Re-apply overlay source changes
        run: |
          # Pulls the latest overlay repo and re-syncs it over the
          # restored tree before every build attempt. This lets a compile
          # error found mid-way through this multi-leg build (like
          # shell_file_select_helper.mm failing on leg 7) get fixed by
          # pushing a corrected commit to the overlay repo, without having
          # to redo the multi-hour gclient sync from scratch -- the next
          # leg just picks up the fix. Safe to run every leg unconditionally:
          # rsync only touches files the overlay actually ships, and
          # touching a file's mtime just makes ninja rebuild that one
          # translation unit (and whatever depends on it) next time.
          rsync -a --exclude 'v8/' "${{ github.workspace }}/overlay/src/" "$CHROMIUM_SRC/"
          rsync -a "${{ github.workspace }}/overlay/src/v8/" "$CHROMIUM_SRC/v8/"

      - name: Check whether already built
        id: check
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          OBJ_COUNT=$(find out/jitless -name "*.o" -o -name "*.a" 2>/dev/null | wc -l | tr -d " ")
          echo "Restored out/jitless contains $OBJ_COUNT already-built .o/.a files"
          echo "(if this is ~0 on leg2+, the checkpoint restore itself lost state --
           if it is large but Siso still reports a from-scratch Pending count,
           that confirms the use_siso=false fallback above is the right fix)"
          IPA=$(find out/jitless -maxdepth 2 -iname "*.ipa" 2>/dev/null | head -n1)
          if [ -n "$IPA" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build time budget
        id: budget
        if: steps.check.outputs.done != 'true'
        run: |
          NOW=$(date +%s)
          ELAPSED_MIN=$(( (NOW - JOB_START_EPOCH) / 60 ))
          # Reserved for archive + verify + upload after the build step,
          # which also grows every leg -- keep this generous.
          POST_BUILD_RESERVE_MIN=75
          HARD_CAP_MIN=355
          REMAINING=$(( HARD_CAP_MIN - ELAPSED_MIN - POST_BUILD_RESERVE_MIN ))
          if [ "$REMAINING" -gt "$BUILD_STEP_TIMEOUT_MINUTES" ]; then REMAINING=$BUILD_STEP_TIMEOUT_MINUTES; fi
          if [ "$REMAINING" -lt 15 ]; then REMAINING=15; fi
          echo "Elapsed before build: ${ELAPSED_MIN} min. Reserving ${POST_BUILD_RESERVE_MIN} min post-build. Build budget: ${REMAINING} min (cap ${BUILD_STEP_TIMEOUT_MINUTES} min)."
          echo "DYNAMIC_BUILD_MINUTES=$REMAINING" >> "$GITHUB_ENV"

      - name: Build
        id: build
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.DYNAMIC_BUILD_MINUTES) }}
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: autoninja -C out/jitless content/shell:content_shell_ipa

      - name: Archive workspace state
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -f state.tar.zst.part-*
          echo "Disk space before archiving:"; df -h "${{ github.workspace }}"
          tar --exclude='.git' -cf - chromium depot_tools | zstd -T0 -3 | split -b 1900m - state.tar.zst.part-
          ls -lh state.tar.zst.part-*
          echo "Verifying archive integrity before upload..."
          cat state.tar.zst.part-* | zstd -t
          echo "Archive OK: $(cat state.tar.zst.part-* | wc -c) bytes across $(ls state.tar.zst.part-* | wc -l) parts"

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jitless-state-leg1
          path: state.tar.zst.part-*
          retention-days: 1
          if-no-files-found: error

  jitless-build-leg2:
    name: JITless / 3. Build leg 2
    needs: jitless-build-leg1
    runs-on: macos-26
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/.rbenv ~/.nvm ~/.gem /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-sdk || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/{WatchOS,AppleTVOS,XROS,DriverKit}*.platform || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          brew cleanup -s >/dev/null 2>&1 || true
          df -h /
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Mount case-sensitive volume for Chromium checkout
        run: |
          # Chromium's source tree requires a case-sensitive filesystem to
          # check out cleanly -- it has paths that collide under
          # case-insensitive comparison. GitHub's macOS runners default to
          # a case-insensitive APFS root volume, which surfaces as
          # "cannot create directory/file ... Invalid argument" partway
          # through gclient sync (or as a silent path collision if it
          # happens during a tar extraction here in a later leg instead of
          # a live git checkout in *-sync). Work around it by doing all
          # chromium/depot_tools I/O on a freshly-created case-sensitive
          # APFS volume, via symlinks so every other step's relative
          # "chromium"/"depot_tools" paths keep working unmodified.
          # Don't pre-create /Volumes/ChromiumCS by hand: /Volumes is
          # root-owned, so a plain `mkdir` there as the runner user fails
          # with "Permission denied". hdiutil attach creates the mount
          # point itself (via the disk-arbitration subsystem, which has
          # the privilege a userland mkdir doesn't) when given -mountpoint
          # on a path that doesn't exist yet.
          hdiutil create -size 200g -fs "Case-sensitive APFS" -volname ChromiumCS -type SPARSE -nospotlight ~/ChromiumCS
          hdiutil attach ~/ChromiumCS.sparseimage -nobrowse -mountpoint /Volumes/ChromiumCS
          mkdir -p /Volumes/ChromiumCS/chromium /Volumes/ChromiumCS/depot_tools
          ln -s /Volumes/ChromiumCS/chromium "${{ github.workspace }}/chromium"
          ln -s /Volumes/ChromiumCS/depot_tools "${{ github.workspace }}/depot_tools"

      - name: Download incoming state
        uses: actions/download-artifact@v4
        with:
          name: jitless-state-leg1

      - name: Extract state
        working-directory: ${{ github.workspace }}
        run: |
          brew install zstd >/dev/null 2>&1 || true
          echo "Disk space before extract:"; df -h "${{ github.workspace }}"
          for part in state.tar.zst.part-*; do cat "$part"; rm -f "$part"; done | zstd -d -T0 -c | tar -xf -
          echo "Disk space after extract:"; df -h "${{ github.workspace }}"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "Verifying restored toolchain..."
          test -x chromium/src/buildtools/mac/gn || { echo "::error::buildtools/mac/gn missing or not executable after restoring state -- the upstream state artifact is incomplete/corrupt (most likely a truncated archive carried over from an earlier leg). Re-run the job that produced the artifact this leg downloaded (or jitless-sync/jit-sync) to regenerate a clean one before retrying this leg."; exit 1; }

      - name: Checkout overlay (source fixes)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Re-apply overlay source changes
        run: |
          # Pulls the latest overlay repo and re-syncs it over the
          # restored tree before every build attempt. This lets a compile
          # error found mid-way through this multi-leg build (like
          # shell_file_select_helper.mm failing on leg 7) get fixed by
          # pushing a corrected commit to the overlay repo, without having
          # to redo the multi-hour gclient sync from scratch -- the next
          # leg just picks up the fix. Safe to run every leg unconditionally:
          # rsync only touches files the overlay actually ships, and
          # touching a file's mtime just makes ninja rebuild that one
          # translation unit (and whatever depends on it) next time.
          rsync -a --exclude 'v8/' "${{ github.workspace }}/overlay/src/" "$CHROMIUM_SRC/"
