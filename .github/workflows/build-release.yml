          echo "Archive OK: $(cat state.tar.zst.part-* | wc -c) bytes across $(ls state.tar.zst.part-* | wc -l) parts"

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jitless-state-leg6
          path: state.tar.zst.part-*
          retention-days: 1
          if-no-files-found: error

