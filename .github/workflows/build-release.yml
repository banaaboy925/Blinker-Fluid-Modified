          # risks the same silent path collisions.
          # Don't pre-create /Volumes/ChromiumCS by hand: /Volumes is
          # root-owned, so a plain `mkdir` there as the runner user fails
          # with "Permission denied". hdiutil attach creates the mount
          # point itself (via the disk-arbitration subsystem, which has
          # the privilege a userland mkdir doesn't) when given -mountpoint
          # on a path that doesn't exist yet.
          hdiutil create -size 200g -fs "Case-sensitive APFS" -volname ChromiumCS -type SPARSE -nospotlight ~/ChromiumCS
          hdiutil attach ~/ChromiumCS.sparseimage -nobrowse -mountpoint /Volumes/ChromiumCS

      - name: Download jitless final state
        uses: actions/download-artifact@v4
        with:
          name: jitless-state-final
          path: jitless-download

      - name: Download jit final state
        uses: actions/download-artifact@v4
        with:
          name: jit-state-final
          path: jit-download

      - name: Re-sign and package both tracks
        run: |
          set -e
          brew install zstd >/dev/null 2>&1 || true
          mkdir -p "${{ github.workspace }}/dist"

          package_track () {
            local TRACK="$1"
            local GET_TASK_ALLOW="$2"
            local VERSION="$3"

            local WORKDIR
            WORKDIR=$(mktemp -d /Volumes/ChromiumCS/pkg.XXXXXX)
            cat "${{ github.workspace }}/$TRACK-download"/state.tar.zst.part-* | zstd -d -T0 -c | tar -xf - -C "$WORKDIR"

            local OUT_DIR="$WORKDIR/chromium/src/out/$TRACK"
            local IPA_PATH
            IPA_PATH=$(find "$OUT_DIR" -maxdepth 2 -iname "*.ipa" | head -n1)
            if [ -z "$IPA_PATH" ]; then
              echo "::error::No .ipa found for $TRACK after all build legs -- it needs another leg. See the LEG COUNT note at the top of this workflow file."
              exit 1
            fi

            local UNPACK
            UNPACK=$(mktemp -d)
            unzip -q "$IPA_PATH" -d "$UNPACK"
            local APP_PATH
            APP_PATH=$(find "$UNPACK/Payload" -maxdepth 1 -iname "*.app" | head -n1)
            local BINARY_NAME
            BINARY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

            local PLIST_PATH="$UNPACK/entitlements.plist"
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>application-identifier</key>'
              echo "  <string>${BUNDLE_ID}</string>"
              echo '  <key>com.apple.private.skip-library-validation</key>'
              echo '  <true/>'
              echo '  <key>get-task-allow</key>'
              echo "  <${GET_TASK_ALLOW}/>"
              echo '</dict>'
              echo '</plist>'
            } > "$PLIST_PATH"
            ldid -S"$PLIST_PATH" "$APP_PATH/$BINARY_NAME"

            local OUT_NAME="BlinkerFluid-${VERSION}-${TRACK}"
            (cd "$UNPACK" && zip -qr "${OUT_NAME}.ipa" Payload)
            cp "$UNPACK/${OUT_NAME}.ipa" "$UNPACK/${OUT_NAME}.tipa"
            mv "$UNPACK/${OUT_NAME}.ipa" "$UNPACK/${OUT_NAME}.tipa" "${{ github.workspace }}/dist/"
            rm -rf "$WORKDIR" "$UNPACK"
          }

          package_track jitless false "${{ needs.jitless-sync.outputs.version || 'resumed' }}"
          package_track jit true "${{ needs.jit-sync.outputs.version || 'resumed' }}"

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlinkerFluid-ipa-tipa
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: BlinkerFluid-ipa-tipa
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.{ipa,tipa}
          generate_release_notes: true
