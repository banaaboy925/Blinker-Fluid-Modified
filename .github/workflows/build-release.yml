  # =========================================================================
  # JIT track (identical shape to JITless above, minus the jitless GN args)
  # =========================================================================

  jit-sync:
    name: JIT / 1. Sync + gn gen
    if: ${{ github.event.inputs.jit_resume_run_id == '' }}
    runs-on: macos-26
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout fork overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Free up disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/.rbenv ~/.nvm ~/.gem /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-sdk || true
          sudo rm -rf ~/Library/Caches/Homebrew || true
          # These platform SDKs aren't needed for a device-arm64 ios_app_ipa
          # build and are multiple GB each on current runner images.
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/{WatchOS,AppleTVOS,XROS,DriverKit}*.platform || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          brew cleanup -s >/dev/null 2>&1 || true
          echo "After cleanup:"; df -h /

      - name: Mount case-sensitive volume for Chromium checkout
        run: |
          # Chromium's source tree requires a case-sensitive filesystem to
          # check out cleanly -- it has paths that collide under
          # case-insensitive comparison. GitHub's macOS runners default to
          # a case-insensitive APFS root volume, which surfaces as
          # "cannot create directory/file ... Invalid argument" partway
          # through gclient sync (or as a silent path collision if it
          # happens during a tar extraction here in a later leg instead of
          # a live git checkout in *-sync). Work around it by doing all
          # chromium/depot_tools I/O on a freshly-created case-sensitive
          # APFS volume, via symlinks so every other step's relative
          # "chromium"/"depot_tools" paths keep working unmodified.
          # Don't pre-create /Volumes/ChromiumCS by hand: /Volumes is
          # root-owned, so a plain `mkdir` there as the runner user fails
          # with "Permission denied". hdiutil attach creates the mount
          # point itself (via the disk-arbitration subsystem, which has
          # the privilege a userland mkdir doesn't) when given -mountpoint
          # on a path that doesn't exist yet.
          hdiutil create -size 200g -fs "Case-sensitive APFS" -volname ChromiumCS -type SPARSE -nospotlight ~/ChromiumCS
          hdiutil attach ~/ChromiumCS.sparseimage -nobrowse -mountpoint /Volumes/ChromiumCS
          mkdir -p /Volumes/ChromiumCS/chromium /Volumes/ChromiumCS/depot_tools
          ln -s /Volumes/ChromiumCS/chromium "${{ github.workspace }}/chromium"
          ln -s /Volumes/ChromiumCS/depot_tools "${{ github.workspace }}/depot_tools"

      - name: Read base commit metadata
        id: meta
        run: |
          COMMIT=$(grep 'Chromium base commit' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          if [ -n "${{ github.event.inputs.chromium_commit }}" ]; then
            COMMIT="${{ github.event.inputs.chromium_commit }}"
          fi
          VERSION=$(grep '^Version:' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300

      - name: gclient sync
        working-directory: ${{ github.workspace }}
        run: |
          # `fetch ios` doesn't just write .gclient config -- it runs its
          # own internal `gclient sync` that checks out src at whatever
          # the *live tip* of Chromium's main branch is at that exact
          # moment, before we then fetch+checkout our older pinned commit
          # on top of it. Upstream Chromium lands many commits an hour, so
          # that transition is against a different, arbitrary starting
          # tree every run -- if a rename or file<->directory type change
          # landed upstream in the wrong spot relative to our pinned
          # commit, the checkout can fail with "cannot create
          # directory/file ... Invalid argument". This is a timing flake,
          # not a deterministic property of the pinned commit, so retry
          # from a clean slate rather than failing the whole sync outright.
          for attempt in 1 2 3; do
            rm -rf chromium
            mkdir -p chromium
            (
              cd chromium
              fetch --nohooks --no-history ios
              cd src
              git fetch --depth=1 origin "${{ steps.meta.outputs.commit }}"
              git checkout --force "${{ steps.meta.outputs.commit }}"
            ) && break
            echo "::warning::gclient sync checkout attempt $attempt failed (likely a timing-dependent collision against Chromium's moving tip -- see comment above); retrying from scratch..."
            if [ "$attempt" = 3 ]; then
              echo "::error::gclient sync checkout failed after 3 clean-slate attempts."
              exit 1
            fi
            sleep 30
          done
          cd chromium
          gclient sync -D --no-history -j 4

      - name: Sync V8 to pinned commit
        working-directory: ${{ env.CHROMIUM_SRC }}/v8
        run: |
          V8_COMMIT=$(grep 'V8 base commit' "${{ github.workspace }}/overlay/BASE_COMMIT.txt" | awk '{print $NF}')
          git fetch origin "$V8_COMMIT"
          git checkout "$V8_COMMIT"

      - name: Overlay Blinker Fluid source changes
        run: |
          rsync -a --exclude 'v8/' "${{ github.workspace }}/overlay/src/" "$CHROMIUM_SRC/"
          rsync -a "${{ github.workspace }}/overlay/src/v8/" "$CHROMIUM_SRC/v8/"

      - name: Run hooks
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: gclient runhooks

      - name: Verify gn toolchain fetched
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          test -x buildtools/mac/gn || { echo "::error::buildtools/mac/gn is missing after gclient runhooks -- the host gn binary was never fetched."; exit 1; }
          ./buildtools/mac/gn --version

      - name: Generate GN args (jit)
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          mkdir -p out/jit
          cat "${{ github.workspace }}/overlay/build_args.gn" > out/jit/args.gn
          {
            echo "v8_jitless = false"
            echo "ios_code_signing_identity = \"\""
            echo "use_siso = false"
          } >> out/jit/args.gn
          gn gen out/jit

      - name: Archive workspace state
        working-directory: ${{ github.workspace }}
        run: |
          brew install zstd >/dev/null 2>&1 || true
          rm -f state.tar.zst.part-*
          echo "Disk space before archiving:"; df -h "${{ github.workspace }}"
          tar --exclude='.git' -cf - chromium depot_tools | zstd -T0 -3 | split -b 1900m - state.tar.zst.part-
          ls -lh state.tar.zst.part-*
          echo "Verifying archive integrity before upload..."
          cat state.tar.zst.part-* | zstd -t
          echo "Archive OK: $(cat state.tar.zst.part-* | wc -c) bytes across $(ls state.tar.zst.part-* | wc -l) parts"

      - name: Upload state
        uses: actions/upload-artifact@v4
        with:
          name: jit-state-sync
          path: state.tar.zst.part-*
          retention-days: 1
          if-no-files-found: error

