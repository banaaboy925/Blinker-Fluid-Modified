name: Build Release (IPA / TIPA)

# Builds Blinker Fluid's standard and JIT editions following the exact
# recipe documented in README.md ("Building v<version>"), then packages
# each as both a .ipa and an AirDrop-friendly .tipa (a .tipa is just a
# renamed .ipa — TrollStore accepts either).
#
# IMPORTANT — read before relying on this in CI:
#   A full Chromium checkout is tens of GB and a from-scratch iOS build can
#   take several hours of CPU time. This workflow uses `gclient sync
#   --no-history` specifically because a *full-history* clone of
#   chromium/src is 50-90+ GB on its own and will exhaust a hosted runner's
#   disk mid-clone (that's the "No space left on device" failure people hit
#   here) — `--no-history` fetches only what's needed for the pinned
#   revision. Even so, the checked-out tree plus build output can still be
#   60-100+ GB, which is more than the ~14 GB free on GitHub's standard
#   hosted macOS runners. To actually get a build out of this workflow you
#   need one of:
#     - a self-hosted macOS runner with a fast disk (200+ GB free) and
#       Xcode installed, registered under the "self-hosted" label used
#       below, or
#     - GitHub's larger hosted runners (macos-15-xlarge or similar, only
#       available on paid plans / larger orgs), selected via the
#       `runner` workflow_dispatch input.
#   The `runner` input lets you pick whichever you have access to without
#   editing the workflow.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to build on"
        type: choice
        options:
          - self-hosted
          - macos-15
          - macos-15-xlarge
        default: self-hosted
      chromium_ref:
        description: "Chromium src commit to sync (defaults to BASE_COMMIT.txt)"
        type: string
        required: false
      version:
        description: "App version, e.g. 0.6.0 (defaults to the pushed tag)"
        type: string
        required: false
  push:
    tags:
      - "v*"

env:
  # Where the Chromium checkout lives, sibling to the overlay checkout.
  CHROMIUM_DIR: ${{ github.workspace }}/chromium
  DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools

jobs:
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      chromium_ref: ${{ steps.resolve.outputs.chromium_ref }}
      version: ${{ steps.resolve.outputs.version }}
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail

          ref="${{ inputs.chromium_ref }}"
          if [ -z "$ref" ]; then
            ref="$(sed -n 's/^Chromium base commit: //p' BASE_COMMIT.txt | head -n1)"
          fi
          echo "chromium_ref=$ref" >> "$GITHUB_OUTPUT"

          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          runner="${{ inputs.runner }}"
          if [ -z "$runner" ]; then
            runner="self-hosted"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

          echo "Resolved chromium_ref=$ref version=$version runner=$runner"

  build:
    needs: resolve-config
    runs-on: ${{ needs.resolve-config.outputs.runner }}
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            out_dir: out/blink14
            bundle_suffix: ""
          - variant: jit
            out_dir: out/blink14-jit
            bundle_suffix: ".jit"
    env:
      CHROMIUM_REF: ${{ needs.resolve-config.outputs.chromium_ref }}
      APP_VERSION: ${{ needs.resolve-config.outputs.version }}
    steps:
      - name: Checkout Blinker Fluid overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Select Xcode
        run: |
          set -euo pipefail
          # README records Xcode 16.2 / iOS 18.2 SDK for the reference build.
          # Fall back gracefully if that exact version isn't on this runner.
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Free up disk space
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # Simulator runtimes, extra Xcode installs, and unrelated toolchains
          # eat tens of GB on hosted runners and aren't needed for a
          # device-only, no-history checkout. Chromium's full git history
          # alone is 50-90+ GB, which is what actually exhausts a hosted
          # runner's disk during `git clone` before gclient even applies
          # DEPS filtering — that's handled separately below via
          # `gclient sync --no-history`, not by cleanup.
          sudo rm -rf /Applications/Xcode_15*.app || true
          sudo rm -rf /Applications/Xcode_14*.app || true
          xcrun simctl delete unavailable || true
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Devices || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf /Applications/Android\ Studio.app || true
          sudo rm -rf "${ANDROID_HOME:-/dev/null}" || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime || true
          sudo rm -rf ~/.rvm ~/.nvm || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install depot_tools
        run: |
          set -euo pipefail
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Sync Chromium at the pinned revision
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          gclient config --unmanaged \
            https://chromium.googlesource.com/chromium/src.git
          cat >> .gclient <<'EOF'
          target_os = ["ios"]
          target_os_only = True
          EOF

          # --no-history is the important flag here: without it, `gclient
          # sync` does a full `git clone` of chromium/src, and that repo's
          # history alone is 50-90+ GB — enough to exhaust a hosted runner's
          # disk before the clone even finishes (this is what the "No space
          # left on device" failure during "Receiving objects" is). With
          # --no-history, git only fetches the objects needed to check out
          # the pinned commit (still DEPS-aware for submodules/subrepos),
          # which is dramatically smaller.
          #
          # --no-history + --nohooks first: the overlay must land before
          # hooks run, since hooks can pull toolchain bits keyed off files
          # we're overlaying.
          gclient sync --no-history --nohooks -r "src@${CHROMIUM_REF}"

          echo "Disk space after Chromium sync:"
          df -h /
          du -sh "$CHROMIUM_DIR"/* 2>/dev/null || true

      - name: Apply the Blinker Fluid overlay
        run: |
          set -euo pipefail
          rsync -a "$GITHUB_WORKSPACE/overlay/src/" "$CHROMIUM_DIR/src/"

      - name: Run gclient hooks
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS_DIR:$PATH"
          cd "$CHROMIUM_DIR/src"
          gclient runhooks

      - name: Stamp app version
        run: |
          set -euo pipefail
          cd "$CHROMIUM_DIR/src"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" \
            content/shell/app/ios/ios-app.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APP_VERSION}" \
            content/shell/app/ios/ios-app.plist

      - name: Configure ${{ matrix.variant }} build
        run: |
          set -euo pipefail
          cd "$CHROMIUM_DIR/src"
          mkdir -p "${{ matrix.out_dir }}"
          if [ -n "${{ matrix.bundle_suffix }}" ]; then
            sed "s/com.nodesclock.blinkerfluid/com.nodesclock.blinkerfluid${{ matrix.bundle_suffix }}/" \
              "$GITHUB_WORKSPACE/overlay/build_args.gn" > "${{ matrix.out_dir }}/args.gn"
          else
            cp "$GITHUB_WORKSPACE/overlay/build_args.gn" "${{ matrix.out_dir }}/args.gn"
          fi
          gn gen "${{ matrix.out_dir }}"

      - name: Build content_shell (${{ matrix.variant }})
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS_DIR:$PATH"
          cd "$CHROMIUM_DIR/src"
          autoninja -C "${{ matrix.out_dir }}" content_shell

      - name: Package IPA (${{ matrix.variant }})
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS_DIR:$PATH"
          cd "$CHROMIUM_DIR/src"
          autoninja -C "${{ matrix.out_dir }}" content_shell_ipa

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          cd "$CHROMIUM_DIR/src/${{ matrix.out_dir }}"

          ipa_path="$(find . -maxdepth 2 -iname '*.ipa' | head -n1)"
          if [ -z "$ipa_path" ]; then
            echo "No .ipa produced by content_shell_ipa in ${{ matrix.out_dir }}" >&2
            find . -maxdepth 2 -iname '*.ipa' -o -iname '*.app'
            exit 1
          fi

          name="BlinkerFluid-${APP_VERSION}-${{ matrix.variant }}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$ipa_path" "$GITHUB_WORKSPACE/dist/${name}.ipa"
          # A .tipa is byte-for-byte the same archive as the .ipa, just
          # renamed so TrollStore will accept it over AirDrop.
          cp "$ipa_path" "$GITHUB_WORKSPACE/dist/${name}.tipa"

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.variant }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: |
            dist/${{ steps.collect.outputs.name }}.ipa
            dist/${{ steps.collect.outputs.name }}.tipa
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [resolve-config, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Blinker Fluid ${{ needs.resolve-config.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
