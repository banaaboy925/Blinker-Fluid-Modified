name: Build Release (IPA / TIPA)
#
# Builds Blinker Fluid for iOS in both JITless and JIT configurations and
# packages each as a .ipa and a .tipa (same payload, alternate extension
# for sideloading tools / source lists that key off it -- TrollStore itself
# accepts either).
#
# IMPORTANT: This does NOT run reliably on standard GitHub-hosted macOS
# runners. A full Chromium checkout + ninja build needs far more disk and
# time than they provide:
#   - Standard hosted macOS runners (e.g. `macos-26`) have ~14GB RAM and
#     only ~25-29GB of free disk. A Chromium + iOS-deps checkout is
#     30-100GB+, so gclient sync will thrash (repeated clone/fail/retry,
#     disk usage sawtoothing up and down) or the job will simply run out
#     of room. This is a known, previously-reported depot_tools/Chromium
#     failure mode on constrained CI, not something specific to this repo.
#   - Even with `--no-history` (used below) and reduced clone parallelism,
#     a *standard* hosted runner is still marginal for a full iOS build;
#     expect it to work reliably only on a larger hosted tier
#     (`macos-26-large`/`-xlarge`, billed substantially higher per minute)
#     or, better, a self-hosted runner.
#
# This workflow targets a self-hosted macOS runner (Apple Silicon
# recommended) with:
#   - Xcode + command line tools installed
#   - depot_tools on PATH
#   - `ldid` installed (e.g. `brew install ldid`) for ad-hoc/fake signing
#   - 200GB+ free disk, ideally with the Chromium checkout persisted
#     across runs (the cached-checkout step below only helps if the disk
#     actually survives between jobs, which hosted runners' ephemeral
#     disks do not).
#
# Update `runs-on: [self-hosted, macOS, chromium-ios]` to match your actual
# runner labels.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      chromium_commit:
        description: "Override Chromium base commit (defaults to BASE_COMMIT.txt)"
        required: false
        default: ""

env:
  DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools
  CHROMIUM_SRC: ${{ github.workspace }}/chromium/src
  BUNDLE_ID: com.nodesclock.blinkerfluid

jobs:
  build:
    name: Build (${{ matrix.jit }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - jit: jitless
            v8_jitless: "true"
            get_task_allow: "false"
            # v8_jitless=true alone is not enough: sparkplug/maglev/turbofan
            # default to true (build_args.gn never sets them) and trip the
            # assert in v8/BUILD.gn ("Sparkplug, Maglev, Turbofan and Wasm
            # are not available in jitless mode"). v8_enable_drumbrake is
            # already on in build_args.gn (Wasm interpreter), which is the
            # documented exception that lets Wasm keep working jitless, so
            # we leave it alone and only disable the JIT tiers.
            extra_gn_args: |
              v8_enable_sparkplug = false
              v8_enable_maglev = false
              v8_enable_turbofan = false
          - jit: jit
            v8_jitless: "false"
            get_task_allow: "true"
            extra_gn_args: ""

    steps:
      - name: Checkout fork overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Read base commit metadata
        id: meta
        run: |
          COMMIT=$(grep 'Chromium base commit' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          if [ -n "${{ github.event.inputs.chromium_commit }}" ]; then
            COMMIT="${{ github.event.inputs.chromium_commit }}"
          fi
          VERSION=$(grep '^Version:' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure depot_tools
        run: |
          if [ ! -d "$DEPOT_TOOLS_DIR" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          else
            git -C "$DEPOT_TOOLS_DIR" pull --ff-only
          fi
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          # Larger buffer / longer low-speed grace period reduces spurious
          # clone failures against googlesource.com over a slow or
          # congested link -- this is additive with --no-history / -j
          # below, not a substitute for them.
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300

      - name: gclient sync (shallow, cached checkout)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p chromium
          cd chromium
          if [ ! -f .gclient ]; then
            # --no-history avoids pulling full repo history for every
            # third_party dep (harfbuzz, ffmpeg, angle, dawn,
            # devtools-frontend, icu, ...) -- on a disk-constrained hosted
            # runner, fetching full history is what causes the repeated
            # "clone / fail / retry" thrashing and disk usage sawtooth.
            fetch --nohooks --no-history ios
          fi
          cd src
          git fetch --depth=1 origin "${{ steps.meta.outputs.commit }}"
          git checkout "${{ steps.meta.outputs.commit }}"
          cd ..
          # -j caps clone parallelism. gclient's default job count is tied
          # to CPU count and, on a shared/throttled hosted-runner network
          # pipe, launching that many simultaneous large clones against
          # chromium.googlesource.com is what triggers the rate-limit
          # failures in the log. Dropping --with_branch_heads/--with_tags
          # also removes refs this build never needs.
          gclient sync -D --no-history -j 4

      - name: Sync V8 to pinned commit
        working-directory: ${{ env.CHROMIUM_SRC }}/v8
        run: |
          V8_COMMIT=$(grep 'V8 base commit' "${{ github.workspace }}/overlay/BASE_COMMIT.txt" | awk '{print $NF}')
          git fetch origin "$V8_COMMIT"
          git checkout "$V8_COMMIT"

      - name: Overlay Blinker Fluid source changes
        run: |
          rsync -a --exclude 'v8/' "${{ github.workspace }}/overlay/src/" "$CHROMIUM_SRC/"
          rsync -a "${{ github.workspace }}/overlay/src/v8/" "$CHROMIUM_SRC/v8/"

      - name: Run hooks
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: gclient runhooks

      - name: Generate GN args
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          mkdir -p out/${{ matrix.jit }}
          cat "${{ github.workspace }}/overlay/build_args.gn" > out/${{ matrix.jit }}/args.gn
          {
            echo "v8_jitless = ${{ matrix.v8_jitless }}"
            echo "ios_code_signing_identity = \"\""
            echo "${{ matrix.extra_gn_args }}"
          } >> out/${{ matrix.jit }}/args.gn
          gn gen out/${{ matrix.jit }}

      - name: Build
        working-directory: ${{ env.CHROMIUM_SRC }}
        # `ios/content_shell` isn't a real target label -- the actual
        # ios_app_bundle is defined as content/shell:content_shell, and
        # content/shell/BUILD.gn *also* defines content_shell_ipa
        # (an ios_app_ipa wrapping bundle_target = ":content_shell"),
        # Chromium's own IPA-packaging template. Building that instead of
        # hand-zipping the raw .app avoids missing embedded frameworks /
        # extensions that a manual `cp -R *.app Payload/` would drop.
        run: autoninja -C out/${{ matrix.jit }} content/shell:content_shell_ipa

      - name: Locate built IPA
        id: locate
        working-directory: ${{ env.CHROMIUM_SRC }}/out/${{ matrix.jit }}
        run: |
          IPA_PATH=$(find . -maxdepth 2 -iname "*.ipa" | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::content_shell_ipa built but no .ipa was found under out/${{ matrix.jit }}"
            find . -maxdepth 2 -iname "*.app" -o -iname "*.ipa"
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Re-sign with ldid and package IPA / TIPA
        working-directory: ${{ env.CHROMIUM_SRC }}/out/${{ matrix.jit }}
        # content_shell_ipa's own packaging (with ios_enable_code_signing =
        # false) produces an ad-hoc/unsigned ipa with no entitlements of
        # its own. Unpack it, ldid-sign the actual app binary with the
        # get-task-allow entitlement this matrix leg needs, and re-zip --
        # rather than reconstructing Payload/ by hand, which risks
        # dropping the embedded frameworks / PlugIns / extensions that
        # ios_app_ipa already assembled correctly.
        run: |
          WORKDIR=$(mktemp -d)
          unzip -q "${{ steps.locate.outputs.ipa_path }}" -d "$WORKDIR"
          APP_PATH=$(find "$WORKDIR/Payload" -maxdepth 1 -iname "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find *.app inside the built ipa" && exit 1
          fi
          BINARY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

          cat > "$WORKDIR/entitlements.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>${BUNDLE_ID}</string>
            <key>com.apple.private.skip-library-validation</key>
            <true/>
            <key>get-task-allow</key>
            <${{ matrix.get_task_allow }}/>
          </dict>
          </plist>
          PLIST
          ldid -S"$WORKDIR/entitlements.plist" "$APP_PATH/$BINARY_NAME"

          OUT_NAME="BlinkerFluid-${{ steps.meta.outputs.version }}-${{ matrix.jit }}"
          (cd "$WORKDIR" && zip -qr "${OUT_NAME}.ipa" Payload)
          cp "$WORKDIR/${OUT_NAME}.ipa" "$WORKDIR/${OUT_NAME}.tipa"
          mkdir -p "${{ github.workspace }}/dist"
          mv "$WORKDIR/${OUT_NAME}.ipa" "$WORKDIR/${OUT_NAME}.tipa" "${{ github.workspace }}/dist/"
          rm -rf "$WORKDIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlinkerFluid-${{ matrix.jit }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.{ipa,tipa}
          generate_release_notes: true
