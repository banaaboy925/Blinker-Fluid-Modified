name: Build Release (IPA / TIPA)
#
# Builds Blinker Fluid for iOS in both JITless and JIT configurations and
# packages each as a .ipa and a .tipa (same payload, alternate extension
# for sideloading tools / source lists that key off it -- TrollStore itself
# accepts either).
#
# IMPORTANT: This does NOT run on standard GitHub-hosted macOS runners.
# A full Chromium checkout + ninja build needs ~100GB of disk and multiple
# hours of wall-clock time, both of which exceed hosted-runner limits
# (hosted macOS runners top out around 14GB free disk and a 6h job cap on
# most plans). This workflow targets a self-hosted macOS runner (Apple
# Silicon recommended) with:
#   - Xcode + command line tools installed
#   - depot_tools on PATH
#   - `ldid` installed (e.g. `brew install ldid`) for ad-hoc/fake signing
#   - Enough free disk (200GB+ recommended) and a fast connection for the
#     initial `gclient sync`, which is cached across runs below.
#
# Update `runs-on: [self-hosted, macOS, chromium-ios]` to match your actual
# runner labels.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      chromium_commit:
        description: "Override Chromium base commit (defaults to BASE_COMMIT.txt)"
        required: false
        default: ""

env:
  DEPOT_TOOLS_DIR: ${{ github.workspace }}/depot_tools
  CHROMIUM_SRC: ${{ github.workspace }}/chromium/src
  BUNDLE_ID: com.nodesclock.blinkerfluid

jobs:
  build:
    name: Build (${{ matrix.jit }})
    runs-on: [self-hosted, macOS, chromium-ios]
    strategy:
      fail-fast: false
      matrix:
        include:
          - jit: jitless
            v8_jitless: "true"
            get_task_allow: "false"
          - jit: jit
            v8_jitless: "false"
            get_task_allow: "true"

    steps:
      - name: Checkout fork overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Read base commit metadata
        id: meta
        run: |
          COMMIT=$(grep 'Chromium base commit' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          if [ -n "${{ github.event.inputs.chromium_commit }}" ]; then
            COMMIT="${{ github.event.inputs.chromium_commit }}"
          fi
          VERSION=$(grep '^Version:' overlay/BASE_COMMIT.txt | awk '{print $NF}')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure depot_tools
        run: |
          if [ ! -d "$DEPOT_TOOLS_DIR" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          else
            git -C "$DEPOT_TOOLS_DIR" pull --ff-only
          fi
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: gclient sync (cached checkout)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p chromium
          cd chromium
          if [ ! -f .gclient ]; then
            fetch --nohooks ios
          fi
          cd src
          git fetch origin "${{ steps.meta.outputs.commit }}"
          git checkout "${{ steps.meta.outputs.commit }}"
          cd ..
          gclient sync -D --with_branch_heads --with_tags

      - name: Sync V8 to pinned commit
        working-directory: ${{ env.CHROMIUM_SRC }}/v8
        run: |
          V8_COMMIT=$(grep 'V8 base commit' "${{ github.workspace }}/overlay/BASE_COMMIT.txt" | awk '{print $NF}')
          git fetch origin "$V8_COMMIT"
          git checkout "$V8_COMMIT"

      - name: Overlay Blinker Fluid source changes
        run: |
          rsync -a --exclude 'v8/' "${{ github.workspace }}/overlay/src/" "$CHROMIUM_SRC/"
          rsync -a "${{ github.workspace }}/overlay/src/v8/" "$CHROMIUM_SRC/v8/"

      - name: Run hooks
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: gclient runhooks

      - name: Generate GN args
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: |
          mkdir -p out/${{ matrix.jit }}
          cat "${{ github.workspace }}/overlay/build_args.gn" > out/${{ matrix.jit }}/args.gn
          {
            echo "v8_jitless = ${{ matrix.v8_jitless }}"
            echo "ios_code_signing_identity = \"\""
          } >> out/${{ matrix.jit }}/args.gn
          gn gen out/${{ matrix.jit }}

      - name: Build
        working-directory: ${{ env.CHROMIUM_SRC }}
        run: autoninja -C out/${{ matrix.jit }} ios/content_shell

      - name: Fake-sign with ldid
        working-directory: ${{ env.CHROMIUM_SRC }}/out/${{ matrix.jit }}
        run: |
          APP_PATH=$(find . -maxdepth 1 -iname "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find built .app bundle" && exit 1
          fi
          cat > entitlements.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>${BUNDLE_ID}</string>
            <key>com.apple.private.skip-library-validation</key>
            <true/>
            <key>get-task-allow</key>
            <${{ matrix.get_task_allow }}/>
          </dict>
          </plist>
          PLIST
          ldid -S"entitlements.plist" "$APP_PATH/content_shell"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA / TIPA
        working-directory: ${{ env.CHROMIUM_SRC }}/out/${{ matrix.jit }}
        run: |
          OUT_NAME="BlinkerFluid-${{ steps.meta.outputs.version }}-${{ matrix.jit }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" "Payload/BlinkerFluid.app"
          zip -qr "${OUT_NAME}.ipa" Payload
          cp "${OUT_NAME}.ipa" "${OUT_NAME}.tipa"
          mkdir -p "${{ github.workspace }}/dist"
          mv "${OUT_NAME}.ipa" "${OUT_NAME}.tipa" "${{ github.workspace }}/dist/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlinkerFluid-${{ matrix.jit }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.{ipa,tipa}
          generate_release_notes: true
